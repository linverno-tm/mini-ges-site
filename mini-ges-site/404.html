<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src %SITE_URL%">
<meta name="robots" content="noindex">
<title>Sahifa topilmadi — MINI GES</title>
<link rel="icon" href="%SITE_URL%assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wdth,wght@85..100,400..700&amp;display=swap">
<style>
  :root { --brand: #004AAD; --ink: #0F2233; --muted: #4F5D69; --paper: #F1F3F2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); background: var(--paper); font: 400 17px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width: 560px; display: grid; justify-items: start; gap: 18px; }
  img { width: 40px; height: auto; }
  .code { font: 700 clamp(88px, 22vw, 150px)/.9 "IBM Plex Sans", sans-serif; font-stretch: 85%; color: var(--brand); }
  h1 { margin: 0; font: 700 clamp(28px, 5vw, 40px)/1.1 "IBM Plex Sans", sans-serif; font-stretch: 85%; }
  p { margin: 0; color: var(--muted); }
  a { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 4px; background: var(--brand); color: #fff; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="%SITE_URL%assets/logo-ulugnor.webp" alt="MINI GES">
  <div class="code" aria-hidden="true">404</div>
  <h1>Bu sahifa topilmadi</h1>
  <p>Havola eskirgan yoki manzil noto'g'ri yozilgan bo'lishi mumkin. Bosh sahifadan davom eting.</p>
  <a href="%SITE_URL%">Bosh sahifaga qaytish</a>
</main>
</body>
</html>
