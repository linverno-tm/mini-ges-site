<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src %SITE_URL%">
<meta name="robots" content="noindex">
<title>Sahifa topilmadi — MINI GES</title>
<link rel="icon" href="%SITE_URL%assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Inter:wght@400&amp;display=swap">
<style>
  :root { --brand: #004AAD; --ink: #0B1B33; --sky: #46C6F7; --green: #54AF3A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: #fff; font: 400 17px/1.6 "Inter", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 85% 0%, rgba(70, 198, 247, .28), transparent 55%), linear-gradient(160deg, var(--brand), var(--ink) 70%); }
  main { max-width: 560px; text-align: center; display: grid; justify-items: center; gap: 20px; }
  img { width: 64px; height: auto; }
  .code { font: 800 clamp(88px, 22vw, 160px)/.9 "Montserrat", sans-serif; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 2px var(--sky); }
  h1 { margin: 0; font: 800 clamp(26px, 5vw, 36px)/1.15 "Montserrat", sans-serif; }
  p { margin: 0; color: rgba(255, 255, 255, .75); }
  a { display: inline-flex; align-items: center; height: 54px; padding: 0 28px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="%SITE_URL%assets/logo-ulugnor.webp" alt="MINI GES">
  <div class="code" aria-hidden="true">404</div>
  <h1>Bu sahifa topilmadi</h1>
  <p>Havola eskirgan yoki manzil noto'g'ri yozilgan bo'lishi mumkin. Bosh sahifadan davom eting.</p>
  <a href="%SITE_URL%">Bosh sahifaga qaytish</a>
</main>
</body>
</html>
